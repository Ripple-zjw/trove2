[package]
name = "trove2"
version = "0.1.0"
description = "Personal tool collection app"
authors = ["ripple"]
edition = "2021"

[lib]
name = "trove2_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
